services:
  node-a:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    command: ["/app/dstore-server", "--config", "/app/config/node-a.toml"]
    volumes:
      - dstore-a:/app/data
  node-b:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["/app/dstore-server", "--config", "/app/config/node-b.toml"]
    volumes:
      - dstore-b:/app/data
  node-c:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["/app/dstore-server", "--config", "/app/config/node-c.toml"]
    volumes:
      - dstore-c:/app/data
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ../docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
volumes:
  dstore-a:
  dstore-b:
  dstore-c:
